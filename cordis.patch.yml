# Default bundle patch. After installing, set your Firefly III instance URL and
# personal access token on the Settings → Firefly III page: the URL is saved back
# here and the token goes to the DSH credential store. The baseUrl below is only
# the fallback default (https only for remote hosts); /firefly-token <token>
# also works for the token.
- insert:
    - id: firefly-iii
      name: dsh-plugin-firefly-iii
      config:
        baseUrl: https://firefly.example.com/
        currency: CNY
        timeZone: Asia/Shanghai
        confirmWrites: true
        pageSize: 25
        maxAttachmentMb: 10
        expectedApiPrefix: '6.7.'
        autoCreate:
          accounts: false
          categories: false
          tags: false
          budgets: false
          piggyBanks: false
